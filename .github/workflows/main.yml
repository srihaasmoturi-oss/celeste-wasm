name: Build and Deploy Celeste WASM

on:
  push:
    branches: [ threads-v2 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js & pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm

      # Step 3: Install .NET SDK 9
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Step 4: Install project dependencies
      - name: Install project dependencies
        run: pnpm i

      # Step 5: Restore .NET workloads
      - name: Restore .NET workloads
        run: cd loader && dotnet workload restore && cd ..

      # Step 6: Install Emscripten SDK (clean method)
      - name: Setup Emscripten SDK
        shell: bash
        run: |
          curl -L https://github.com/emscripten-core/emsdk/archive/refs/tags/3.1.56.tar.gz | tar xz
          cd emsdk-3.1.56
          ./emsdk install 3.1.56
          ./emsdk activate 3.1.56
          source ./emsdk_env.sh
          emcc --version
          cd ..

      # Step 7: Build WASM backend + frontend
      - name: Build WASM + Frontend
        shell: bash
        run: |
          # Activate Emscripten environment
          source ./emsdk-3.1.56/emsdk_env.sh
          emcc --version

          # Build Celeste-WASM backend
          make publish VERBOSE=1

          # Build frontend (Vite TSX -> JS)
          cd frontend
          pnpm install
          pnpm build

          # Copy assets into dist
          mkdir -p dist/assets
          cp -r ../assets/* dist/assets/
          cd ..

      # Step 8: Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: celeste-wasm
          directory: frontend/dist
