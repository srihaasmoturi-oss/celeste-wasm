name: Build and Deploy Celeste WASM

on:
  push:
    branches: [ threads-v2 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Optional: install emsdk (if your Makefile needs it). It's heavy and slow.
      - name: Setup Emscripten SDK (optional, remove if not needed)
        shell: bash
        run: |
          git clone https://github.com/emscripten-core/emsdk
          ./emsdk/emsdk install 3.1.56
          ./emsdk/emsdk activate 3.1.56

      - name: Build WASM + .NET (Makefile)
        shell: bash
        env:
          # ensure replaceruntime.sh etc. work in non-interactive runner
          NUGET_PACKAGES: ${{ github.workspace }}/nuget
        run: |
          # if you installed emsdk above, source it so its tools are available
          if [ -f ./emsdk/emsdk_env.sh ]; then source ./emsdk/emsdk_env.sh || true; fi

          # run the project's Makefile publish target
          make publish

      - name: Build frontend (Vite)
        shell: bash
        run: |
          cd frontend
          pnpm install
          pnpm build
          # optional: copy site-level assets into dist if needed
          if [ -d ../assets ]; then
            mkdir -p dist/assets
            cp -r ../assets/* dist/assets/ || true
          fi
          cd ..

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # MUST match the project name in Cloudflare Pages exactly:
          projectName: celeste-wasm
          directory: frontend/dist
