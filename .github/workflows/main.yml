name: Build and Deploy Celeste WASM to Youware

on:
  push:
    branches: [ srihaasmoturi-oss-patch-1 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js & pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm

      # Step 3: Install .NET SDK 9
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Step 4: Install project dependencies
      - name: Install project dependencies
        run: pnpm i

      # Step 5: Restore .NET workloads
      - name: Restore .NET workloads
        run: cd loader && dotnet workload restore && cd ..

      # Step 6: Clone and setup Emscripten
      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk
          ./emsdk/emsdk install 3.1.56
          ./emsdk/emsdk activate 3.1.56
      
      # Step 7: Activate Emscripten environment
      - name: Activate Emscripten
        shell: bash
        run: |
          source ./emsdk/emsdk_env.sh
          emcc --version
      
      # Step 8: Build the TSX/JS frontend
      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          pnpm install
          pnpm build
          cd ..
      
      # Step 9: Build the .NET / WASM backend
      - name: Build Celeste-WASM
        shell: bash
        run: |
          source ./emsdk/emsdk_env.sh
          make publish
      
      # Step 10: Checkout Youware repository
      - name: Checkout Youware repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/celeste-wasm
          path: youware-repo
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      # Step 11: Copy Celeste build output to Youware public/
      - name: Copy build output to Youware
        run: |
          if [ -d "youware-repo" ]; then
            mkdir -p youware-repo/public
            cp -r frontend/dist/* youware-repo/public/
            echo "Build output copied to Youware repository"
          else
            echo "Youware repository not found, skipping push"
          fi

      # Step 12: Build Youware project
      - name: Build Youware project
        working-directory: youware-repo
        run: |
          npm install
          npm run build
        continue-on-error: true

      # Step 13: Commit and push to Youware repository
      - name: Commit and push to Youware
        working-directory: youware-repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build: Update Celeste WASM from $(date +%Y-%m-%d\ %H:%M:%S)"
            git push
          fi
        continue-on-error: true

      # Optional: Upload dist/ as artifact for debugging
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celeste-wasm-build
          path: frontend/dist/
          retention-days: 7
