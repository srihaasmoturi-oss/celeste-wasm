name: Build and Deploy Celeste WASM

on:
  push:
    branches: [ threads-v2 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js + pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install -g pnpm

      # Step 3: Setup .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Step 4: Setup Emscripten SDK
      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk
          cd emsdk
          ./emsdk install 3.1.56
          ./emsdk activate 3.1.56
          echo "source $(pwd)/emsdk_env.sh" >> $HOME/.bashrc
          echo "EMSDK=$(pwd)" >> $GITHUB_ENV
      - name: Load Emscripten Environment
        run: |
          source $HOME/.bashrc
          emcc --version

      # Step 5: Build everything
      - name: Build Celeste-WASM
        shell: bash
        run: |
          source $HOME/.bashrc
          dotnet --version
          make publish

          cd frontend
          pnpm install
          pnpm build
          mkdir -p dist/assets
          cp -r ../assets/* dist/assets/ || echo "No external assets found"
          cd ..

      # Step 6: Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: celeste-wasm
          directory: frontend/dist
