name: Build and Deploy Celeste WASM Replit

on:
  push:
    branches: [ threads-v2 ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js & pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install pnpm
        run: npm install -g pnpm

      # Step 3: Install .NET SDK 9
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Step 4: Install project dependencies
      - name: Install project dependencies
        run: pnpm i

      # Step 5: Restore .NET workloads
      - name: Restore .NET workloads
        run: cd loader && dotnet workload restore && cd ..

      # Step 6: Clone and setup Emscripten
      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk
          ./emsdk/emsdk install 3.1.56
          ./emsdk/emsdk activate 3.1.56

      # Step 7: Activate Emscripten environment
      - name: Activate Emscripten
        shell: bash
        run: |
          source ./emsdk/emsdk_env.sh
          emcc --version

      # Step 8: Build the TSX/JS frontend
      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          pnpm install
          pnpm build
          cd ..

      # Step 9: Build the .NET / WASM backend
      - name: Build Celeste-WASM
        shell: bash
        run: |
          source ./emsdk/emsdk_env.sh
          make publish

      # Step 10: Deploy to GitHub repo for Replit
      - name: Deploy to Replit GitHub Repo
        shell: bash
        run: |
          echo "Deploying to Replit GitHub repository..."
      
          # Setup Git config
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
      
          # Go to frontend build output
          cd frontend/dist
      
          # Initialize local repo if needed
          if [ ! -d ".git" ]; then
            git init
          fi
      
          # Add remote (directly using GITHUB_TOKEN)
          if ! git remote | grep -q "replit"; then
            git remote add replit https://${{ secrets.REPLIT_PAT }}@github.com/srihaasmoturi-oss/Celeste-Please-Work.git
          fi
      
          # Stage all files
          git add -A
      
          # Commit changes only if there are any
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping commit."
          else
            git commit -m "Deploy build $(date +%Y-%m-%d:%H:%M:%S)"
          fi
      
          # Force push to main (will create main if it doesn't exist)
          git branch -M main
          git push --force replit main
